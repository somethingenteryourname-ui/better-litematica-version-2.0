name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: build
        run: |
          settings=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$settings" ]; then
            echo "Couldn't find settings.gradle anywhere in the repo. These files were uploaded:"
            find . -not -path './.git/*' -type f | head -n 100
            exit 1
          fi
          dir=$(dirname "$settings")
          echo "Building the project in: $dir"
          cd "$dir"
          gradle build
      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: HoloPrint-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
